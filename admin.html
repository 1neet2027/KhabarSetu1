<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - KhabarSetu</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--soft:#64748b;--border:#e2e8f0;--primary:#dc2626;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box} body{font-family:Inter,system-ui;background:var(--bg);color:var(--text)}
.container{max-width:760px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
h1{font-size:22px;font-weight:800} label{font-size:13px;font-weight:700;color:var(--soft);margin-top:12px;display:block}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;margin-top:8px}
textarea{min-height:80px} .btn{padding:12px 18px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;width:100%}
.btn-primary{background:var(--text);color:#fff} .btn-red{background:var(--primary);color:#fff;margin-top:10px}
.hidden{display:none} .login-box{max-width:400px;margin:80px auto;text-align:center}
.news-item{display:flex;gap:12px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff}
.news-item img{width:60px;height:50px;border-radius:8px;object-fit:cover}
</style>
</head>
<body>

<div id="login" class="container login-box">
<div class="card">
<h1>KhabarSetu Admin</h1>
<p style="font-size:13px;color:var(--soft);margin-top:6px">Sirf tumhare liye secret link</p>
<input type="password" id="pass" placeholder="Password dalo">
<button class="btn btn-primary" style="margin-top:12px" onclick="doLogin()">Login</button>
<p style="font-size:11px;color:#94a3b8;margin-top:10px">Password: <b>khabarsetu123</b></p>
<p id="err" style="color:red;font-size:12px;margin-top:8px;display:none">Galat password!</p>
</div>
</div>

<div id="panel" class="container hidden">
<div class="card" style="background:#0f172a;color:#fff">
<h1 style="color:#fff">Post Editor - Ready!</h1>
<p style="color:#94a3b8;font-size:13px;margin-top:4px">Nayi khabar jodo aur Download dabao</p>
</div>

<div class="card">
<label>Headline / Title</label>
<input id="title" placeholder="Jaipur me naya...">
<label>Summary (2 line)</label>
<textarea id="summary" placeholder="Short summary..."></textarea>
<label>Category</label>
<select id="label"><option>राजस्थान</option><option>India</option><option>शिक्षा</option><option>Jobs</option><option>Jamwa Ramgarh</option></select>
<label>Image Link</label>
<input id="image" placeholder="https://...">
<button class="btn btn-primary" style="margin-top:14px" onclick="addNews()">+ Add to List</button>
</div>

<div class="card">
<h2 style="font-size:16px">Tumhari Khabrein (<span id="count">0</span>)</h2>
<div id="list" style="margin-top:10px"></div>
</div>

<div class="card" style="border:2px dashed #dc2626">
<h2 style="font-size:16px">Live Kaise Karein?</h2>
<p style="font-size:12px;margin-top:6px">1. Download dabao 2. GitHub par index.html upload karo</p>
<button class="btn btn-red" onclick="downloadIndex()">⬇️ Download New index.html</button>
</div>
</div>

  {title:"जयपुर में Hawa Mahal पर नया लाइट शो शुरू",summary:"Jaipur Nagar Nigam ne naya light show shuru kiya.",label:"राजस्थान",image:"https://images.unsplash.com/photo-1599661046289-e31897846e41?w=800",date:"13 May 2026"},
  {title:"RBSE 10वीं 12वीं रिजल्ट 15 मई को",summary:"RBSE Ajmer ne date confirm ki.",label:"शिक्षा",image:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=800",date:"13 May 2026"}
];
let NEWS = JSON.parse(localStorage.getItem('khabarsetu_news_v2') || 'null') || DEFAULT_NEWS;

function doLogin(){
  var p = document.getElementById('pass').value.trim();
  if(p === 'khabarsetu123'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    render();
  } else {
    document.getElementById('err').style.display='block';
  }
}
function save(){ localStorage.setItem('khabarsetu_news_v2', JSON.stringify(NEWS)); }
function render(){
  document.getElementById('count').innerText = NEWS.length;
  var html = '';
  for(var i=0;i<NEWS.length;i++){
    var n = NEWS[i];
    html += '<div class="news-item"><img src="'+n.image+'"><div style="flex:1"><div style="font-size:11px;color:#dc2626;font-weight:700">'+n.label+'</div><div style="font-size:13px;font-weight:700">'+n.title+'</div></div><button onclick="delNews('+i+')" style="padding:4px 8px">X</button></div>';
  }
  document.getElementById('list').innerHTML = html;
}
function addNews(){
  var t=document.getElementById('title').value.trim();
  var s=document.getElementById('summary').value.trim();
  var l=document.getElementById('label').value;
  var im=document.getElementById('image').value.trim() || 'https://images.unsplash.com/photo-1599661046289-e31897846e41?w=800';
  if(!t||!s){ alert('Title aur Summary likho!'); return; }
  NEWS.unshift({title:t, summary:s, label:l, image:im, date:'13 May 2026'});
  save(); render();
  document.getElementById('title').value=''; document.getElementById('summary').value=''; document.getElementById('image').value='';
  alert('Add ho gayi!');
}
function delNews(i){ NEWS.splice(i,1); save(); render(); }
