:pointer}.detail-body{max-width:800px;margin:0 auto;padding:16px}.top-img{width:100%;height:220px;object-fit:cover;border-radius:12px;margin-top:10px}.detail-label{color:#ef4444;font-size:12px;font-weight:800;margin-top:10px}.detail-title{font-size:22px;font-weight:900;margin-top:10px;line-height:1.3}.detail-full{color:#e2e8f0;font-size:14px;line-height:1.8;margin-top:14px}.detail-full p{margin-bottom:10px}.border-box{border:2px solid #ef4444;background:#1e293b;padding:14px;border-radius:12px;margin:14px 0}.highlight{background:#facc15;color:#000;padding:3px 8px;border-radius:6px;font-weight:800}.big-text{font-size:19px;font-weight:900;color:#fff;display:block;margin:10px 0}.mid-img{width:100%;border-radius:12px;margin:14px 0}.link-btn{display:inline-block;background:#3b82f6;color:#fff;padding:10px 18px;border-radius:10px;font-weight:800;font-size:13px;text-decoration:none;margin:10px 0}.htag{background:#0f172a;border:1px solid #334155;color:#38bdf8;padding:5px 10px;border-radius:20px;font-size:11px;display:inline-block;margin:3px}.hashtag-box{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;padding:12px;background:#1e293b;border:1px solid #334155;border-radius:10px}.footer{text-align:center;padding:20px;color:#475569;font-size:11px;border-top:1px solid #1e293b;margin-top:20px}</style></head><body><header><div class="logo">KHABAR<span>SETU</span></div><div class="tagline">हर खबर, एक जगह</div><div class="cat-bar" id="catBar"></div></header><div class="main"><div id="newsList"></div></div><div class="footer">© 2026 KhabarSetu</div><div id="detail"><div class="detail-header"><div class="back" onclick="closeDetail()">←</div><div style="font-weight:700">पूरा समाचार</div></div><div class="detail-body"><div id="detailLabel" class="detail-label"></div><div id="detailTitle" class="detail-title"></div><img id="detailImg" class="top-img"><div id="detailFull" class="detail-full"></div><div id="detailDate" style="color:#475569;font-size:10px;margin-top:10px"></div><div id="hashtagBox" class="hashtag-box"></div><div style="margin-top:24px;font-weight:800;border-left:3px solid #ef4444;padding-left:10px">और भी खबरें</div><div id="suggestList" style="margin-top:10px"></div></div></div><script>const NEWS=[{"title":"भारत का तिरंगा फिर सबसे ऊपर! 🇮🇳🥇 हॉकी में GOLD पर कब्ज़ा!","summary":"[img]photo8514889577489415286.jpeg[/img]\n\nनागोया, जापान: INDIA ने फिर रचा इतिहास! भारतीय पुरुष हॉकी टीम ने Asian Games 2026 के फाइनल में Malaysia को 5-1 के बड़े अंतर से हराकर Gold Medal जीत लिया है।\n\n[img]photo2151561487331691541.jpeg[/img]\n\nAichi-Nagoya में खेले गए इस हाई-वोल्टेज फाइनल में टीम इंडिया शुरू से ही हावी रही। पहला क्वार्टर खत्म होते-होते भारत 2-0 से आगे था। कप्तान हरमनप्रीत सिंह की लीडरशिप, जुगराज सिंह (31), सुखजीत, विवेक (32), राजिंदर (78) और मनप्रीत की शानदार तालमेल ने मलेशिया की एक न चलने दी।\n\n[img]photo7030105105912340609.jpeg[/img]\n\nये स्कोरलाइन 2023 Hangzhou Asian Games के फाइनल जैसी ही है, जहाँ भी भारत ने मलेशिया को 5-1 से हराया था। इतिहास ने खुद को दोहराया है!\n\n[img]photo8959320364354900420.jpeg[/img]\n\nइस जीत के 2 बड़े मतलब हैं:\n1. GOLD MEDAL - Asian Games में 4th Gold 2. LA Olympics 2028 के लिए सीधा Qualification - अब ओलंपिक का टिकट पक्का! \nआखिरी सीटी बजते ही पूरा स्टेडियम ‘चक दे इंडिया’ और ‘भारत माता की जय’ से गूंज उठा। खिलाड़ी एक-दूसरे से लिपट गए, तिरंगा लहराया।\n\n[img]photo6016780906934913078.jpeg[/img]","label":"Sports","image":"traditional-lavender-lprehzdb.edgeone.dev","date":"3/10/2026","hashtags":""},{"title":"Pakistan की धुलाई! India ने 211 ठोक कर जीता Gold - Abhishek ने 28 गेंद में 61 - Record टूट गया!","summary":"INDIA WINS GOLD! 🥇🇮🇳 Cricket me itihas rach diya!\n\n[img1]\n\nTeam India ne Asian Games 2023 me Gold Medal jeet kar poore desh ka seena chauda kar diya! 211/6 ka target defend karna koi aasan kaam nahi tha, lekin hamare ladko ne kar dikhaya.\n\n[img4]\n\nFinal match ka romanch hi kuch aur tha. Afghanistan ke saamne 211 runs ka target rakha gaya tha. Jasprit Bumrah ki gendbaazi ne to kamaal hi kar diya - unki speed aur accuracy ke saamne koi tik nahi paaya.\n\n[img5]\n\n🔥 BUMRAH KA JADOO:\nJasprit Bumrah ne apne 4 over me sirf 20 runs diye aur 2 crucial wickets liye. Unka wo celebration moment ab har jagah viral ho raha hai.\n\n[img3]\n\n💙 TEAM CELEBRATION:\nGold jeetne ke baad ground me jo jashn hua wo dekhne layak tha. Saare players ek doosre se gale mil rahe the, Tiranga lehra raha tha!\n\n[img2]\n\nBCCI ne bhi team ko badhai di hai aur kaha hai ki ye sirf shuruat hai. Aane wale World Cup me bhi aisi hi performance ki umeed hai.\n\nPlayer Highlights:\n[img6]\n[img7]\n\nJai Hind! 🇮🇳 Bharat Mata Ki Jai!\n\n#IndiaWinsGold #AsianGames2023 #TeamIndia #BCCI #GoldMedal","label":"Sports","image":"[img1]","date":"3/10/2026","hashtags":"#India_Beat_Pakistan, #IND_vs_PAK_Final, #India_Win_Gold, #Abhishek_Sharma_61, #Pakistan_Ki_Dhulai"},{"title":"Rohit Sharma 92 पर Out - लगातार दूसरा शतक से 8 रन से चूके","summary":"[border]\n[highlight]🔥 BREAKING: Rohit Sharma 92 रन पर आउट[/highlight]\n[/border]\n\n[big]भारत vs वेस्टइंडीज तीसरा वनडे - 3 Oct 2026[/big]\n\nरोहित ने 92 रन बनाए और Keemo Paul की गेंद पर आउट हो गए।\n\n[img]https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=800[/img]\n\n[link url=https://sports.ndtv.com]👉 Live Score[/link]","label":"Sports","image":"https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=800","date":"3 Oct 2026","hashtags":"#Rohit_Sharma, #IND_vs_WI"}];let activeCat="All";function getCategories(){return ["All"].concat([...new Set(NEWS.map(function(n){return n.label}))]);}function renderCats(){let cats=getCategories();let html="";for(let i=0;i<cats.length;i++){let c=cats[i];let cls="cat";if(c===activeCat) cls+=" active";html+="<div class=\""+cls+"\" onclick=\"setCat('"+c.replace(/'/g,"\'")+"')\">"+c+"</div>";}document.getElementById("catBar").innerHTML=html;}function setCat(c){activeCat=c;renderCats();renderList();}function filtered(){if(activeCat==="All") return NEWS;return NEWS.filter(function(n){return n.label===activeCat;});}function renderList(){let list=filtered();let html="";for(let i=0;i<list.length;i++){let n=list[i];let idx=NEWS.indexOf(n);let tags=(n.hashtags||"").split(",").slice(0,2).join(" ");html+="<div class=\"news-card\" onclick=\"openDetail("+idx+")\"><img src=\""+n.image+"\"><div style=\"flex:1\"><div class=\"label\">"+n.label+"</div><div class=\"title\">"+n.title+"</div><div class=\"summary\">"+n.summary.replace(/\[.*?\]/g,"").substring(0,90)+"...</div><div class=\"hashtag\">"+tags+"</div><div class=\"read\">Read More →</div><div class=\"date\">"+n.date+"</div></div></div>";}document.getElementById("newsList").innerHTML=html;}function formatContent(t){let h=t;h=h.replace(/\[border\]/gi,"<div class=\"border-box\">");h=h.replace(/\[\/border\]/gi,"</div>");h=h.replace(/\[highlight\]/gi,"<span class=\"highlight\">");h=h.replace(/\[\/highlight\]/gi,"</span>");h=h.replace(/\[big\]/gi,"<span class=\"big-text\">");h=h.replace(/\[\/big\]/gi,"</span>");h=h.replace(/\[color=([^\]]+)\]/gi,"<span style=\"color:$1;font-weight:700\">");h=h.replace(/\[\/color\]/gi,"</span>");h=h.replace(/\[img\](.*?)\[\/img\]/gi,"<img class=\"mid-img\" src=\"$1\">");h=h.replace(/\[link url=([^\]]+)\](.*?)\[\/link\]/gi,"<a class=\"link-btn\" href=\"$1\" target=\"_blank\">$2</a>");let parts=h.split("\n");let out="";for(let j=0;j<parts.length;j++){let p=parts[j].trim();if(!p) continue;if(p.indexOf("<div")===0||p.indexOf("<img")===0||p.indexOf("<a")===0||p.indexOf("</div>")===0) out+=p;else out+="<p>"+p+"</p>";}return out;}function openDetail(i){let n=NEWS[i];document.getElementById("detailLabel").innerText=n.label;document.getElementById("detailTitle").innerText=n.title;document.getElementById("detailImg").src=n.image;document.getElementById("detailFull").innerHTML=formatContent(n.summary);document.getElementById("detailDate").innerText=n.date;let tags=(n.hashtags||"").split(",");let hBox="";for(let k=0;k<tags.length;k++){if(tags[k].trim()) hBox+="<span class=\"htag\">"+tags[k].trim()+"</span>";}document.getElementById("hashtagBox").innerHTML=hBox;let sug="";let count=0;for(let s=0;s<NEWS.length&&count<3;s++){if(s!==i){sug+="<div class=\"news-card\" onclick=\"openDetail("+s+")\"><img src=\""+NEWS[s].image+"\"><div><div class=\"label\">"+NEWS[s].label+"</div><div class=\"title\" style=\"font-size:12px\">"+NEWS[s].title+"</div></div></div>";count++;}}document.getElementById("suggestList").innerHTML=sug;document.getElementById("detail").style.display="block";window.scrollTo(0,0);}function closeDetail(){document.getElementById("detail").style.display="none";}renderCats();renderList();</script></body></html>
