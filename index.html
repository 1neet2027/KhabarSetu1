<script>
const NEWS = [{"title":"🏏 विराट कोहली का बड़ा ऐलान! 2027 वर्ल्ड कप होगा भारत के लिए उनका आखिरी World Cup","summary":"विराट कोहली का बड़ा ऐलान: 2027 वर्ल्ड कप होगा भारत के लिए आखिरी World Cup\n\nभारतीय क्रिकेट के स्टार बल्लेबाज विराट कोहली ने 26 सितंबर 2026 को 2027 ICC Men’s Cricket World Cup को लेकर एक बड़ा बयान दिया। कोहली ने पुष्टि की कि 2027 में होने वाला World Cup भारत के लिए उनका आखिरी World Cup होगा।\n\nकोहली ने यह बात JioStar के साथ बातचीत में कही। उन्होंने बताया कि 2027 World Cup उनके लिए खास motivation होगा और उनका लक्ष्य भारत के साथ इस टूर्नामेंट को जीतना है। उन्होंने यह भी कहा कि इसके लिए वह अपना पूरा प्रयास करने के लिए तैयार हैं।\n\n2027 World Cup में कोहली की पांचवीं उपस्थिति होगी। इससे पहले वह 2011, 2015, 2019 और 2023 के ODI World Cup में भारत का प्रतिनिधित्व कर चुके हैं। 2011 में भारत ने घरेलू मैदान पर World Cup जीता था और कोहली उस विजेता टीम का हिस्सा थे।\n\n2023 में भारत ने शानदार प्रदर्शन करते हुए फाइनल तक का सफर तय किया था, लेकिन अहमदाबाद में खेले गए फाइनल में ऑस्ट्रेलिया ने भारत को हराकर खिताब अपने नाम किया। अब 2027 में कोहली के सामने एक और World Cup अभियान होगा।\n\nकोहली का World Cup रिकॉर्ड भी शानदार रहा है। ICC के अनुसार उन्होंने World Cup में 37 मैचों में 1,795 रन बनाए हैं। उनके नाम World Cup में पांच शतक और 12 अर्धशतक हैं, जबकि उनका सर्वोच्च स्कोर 117 रन है।\n\nपूरे ODI करियर में भी कोहली ने कई बड़े रिकॉर्ड बनाए हैं। 26 सितंबर 2026 तक उनके नाम 14,941 ODI रन और 54 शतक दर्ज हैं। वह ODI क्रिकेट में सबसे ज्यादा शतक बनाने वाले बल्लेबाज हैं।\n\nकोहली पहले ही Test और T20 International क्रिकेट से संन्यास ले चुके हैं। ऐसे में वर्तमान में उनका अंतरराष्ट्रीय क्रिकेट का ध्यान 50-over ODI format पर है। हालांकि, 2027 World Cup को अपना आखिरी World Cup बताने का मतलब यह नहीं है कि उन्होंने उसी समय ODI क्रिकेट से पूर्ण संन्यास की तारीख घोषित कर दी है।\n\n2027 World Cup दक्षिण अफ्रीका, जिम्बाब्वे और नामीबिया में आयोजित किया जाएगा। ICC के अनुसार यह टूर्नामेंट तीन देशों में खेला जाएगा और भारत की टीम भी इस बड़े टूर्नामेंट की तैयारी करेगी।\n\nकोहली ने 50-over World Cup की चुनौती के बारे में भी बात की। उनके अनुसार World Cup में लगातार कई मुकाबलों में उच्च स्तर की intensity बनाए रखना आसान नहीं होता। विदेशी परिस्थितियां भी खिलाड़ियों के सामने अलग चुनौती रखती हैं।\n\n2027 का World Cup इसलिए भी महत्वपूर्ण होगा क्योंकि यह कोहली के World Cup career का अगला और आखिरी अध्याय होगा। 2011 की ऐतिहासिक जीत से लेकर 2023 के फाइनल तक, कोहली भारतीय World Cup इतिहास के कई महत्वपूर्ण पलों का हिस्सा रहे हैं।\n\nअब भारतीय क्रिकेट प्रशंसकों की नजरें 2027 पर होंगी। कोहली ने अपना लक्ष्य स्पष्ट कर दिया है—भारत के लिए एक और World Cup campaign खेलना और खिताब जीतने के लिए अपना पूरा प्रयास करना।\n\nयह घोषणा भारतीय क्रिकेट में एक महत्वपूर्ण मोड़ है, लेकिन 2027 World Cup अभी भविष्य में है। उससे पहले भारत के पास कई ODI मुकाबले और तैयारियां होंगी। टीम संयोजन, खिलाड़ियों का प्रदर्शन और टूर्नामेंट के समय की परिस्थितियां अंतिम अभियान में महत्वपूर्ण भूमिका निभाएंगी।\n\nविराट कोहली के लिए 2027 World Cup सिर्फ एक और tournament नहीं होगा। यह उनके World Cup सफर का अंतिम अध्याय होगा और भारतीय क्रिकेट प्रशंसकों के लिए उन्हें एक बार फिर सबसे बड़े 50-over मंच पर देखने का अवसर होगा।\n\nSOURCE:\nICC Cricket\nReuters\nJioStar interview\nPublished: 26 September 2026","label":"India","image":"https://upload.wikimedia.org/wikipedia/commons/1/15/Virat_Kohli_portrait.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original","date":"28/9/2026"},{"title":"जयपुर में Hawa Mahal पर नया लाइट शो शुरू","summary":"Jaipur Nagar Nigam ne naya light show shuru kiya.","label":"राजस्थान","image":"https://images.unsplash.com/photo-1599661046289-e31897846e41?w=800","date":"13 May 2026"},{"title":"RBSE 10वीं 12वीं रिजल्ट 15 मई को","summary":"RBSE Ajmer ne date confirm ki.","label":"शिक्षा","image":"https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=800","date":"13 May 2026"}];
document.getElementById('newsList').innerHTML = NEWS.map(function(n){return '<div class="news-card"><img src="'+n.image+'" onerror="this.src=\'https://via.placeholder.com/90\'"><div><div style="color:#ef4444;font-size:11px;font-weight:700">'+n.label+'</div><div style="font-weight:700;font-size:15px;margin-top:4px">'+n.title+'</div><div style="color:#94a3b8;font-size:12px;margin-top:5px;white-space:pre-line">'+n.summary+'</div><div style="color:#475569;font-size:10px;margin-top:6px">'+n.date+'</div></div></div>'}).join('');
</script>
