<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KHABARSETU</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui;background:#0f172a;color:#fff;min-height:100vh}header{background:#020617;border-bottom:1px solid #1e293b;padding:12px 16px;position:sticky;top:0;z-index:50}.logo{font-weight:900;font-size:21px}.logo span{color:#ef4444}.tagline{font-size:10px;color:#94a3b8}.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px 0}.cat-bar::-webkit-scrollbar{display:none}.cat{padding:8px 16px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.cat.active{background:#ef4444;border-color:#ef4444;color:#fff}.main{max-width:900px;margin:0 auto;padding:14px}.news-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:12px;margin-bottom:12px;display:flex;gap:10px;cursor:pointer}.news-card img{width:92px;height:72px;border-radius:10px;object-fit:cover}.label{color:#ef4444;font-size:10px;font-weight:800}.title{font-weight:800;font-size:14.5px;margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.summary{color:#94a3b8;font-size:11.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.read{color:#38bdf8;font-size:11px;font-weight:700;margin-top:6px}.date{color:#475569;font-size:9px;margin-top:4px}#detail{position:fixed;inset:0;background:#0f172a;z-index:100;overflow-y:auto;display:none}.detail-header{background:#020617;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0}.back{width:36px;height:36px;border-radius:50%;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;cursor:pointer}.detail-body{max-width:800px;margin:0 auto;padding:16px}.detail-body .top-img{width:100%;height:220px;object-fit:cover;border-radius:12px;margin-top:10px}.detail-title{font-size:20px;font-weight:900;margin-top:14px;line-height:1.3}.detail-label{color:#ef4444;font-size:12px;font-weight:800;margin-top:12px}.detail-full{color:#e2e8f0;font-size:14px;line-height:1.8;margin-top:16px}.detail-full img.mid-img{width:100%;height:auto;border-radius:12px;margin:16px 0;display:block}.detail-full p{margin-bottom:14px}.suggest-title{font-size:16px;font-weight:800;margin-top:28px;margin-bottom:10px;border-left:3px solid #ef4444;padding-left:10px}.footer{margin-top:30px;padding:16px;text-align:center;color:#475569;font-size:11px;border-top:1px solid #1e293b}</style></head><body><header><div><div class="logo">KHABAR<span>SETU</span></div><div class="tagline">हर खबर, एक जगह</div></div><div class="cat-bar" id="catBar"></div></header><div class="main"><div id="newsList"></div></div><div class="footer">© 2026 KhabarSetu</div><div id="detail"><div class="detail-header"><div class="back" onclick="closeDetail()">←</div><div style="font-weight:700">पूरा समाचार</div></div><div class="detail-body"><div id="detailLabel" class="detail-label"></div><div id="detailTitle" class="detail-title"></div><img id="detailImg" class="top-img"><div id="detailFull" class="detail-full"></div><div id="detailDate" class="date"></div><div class="suggest-title">और भी खबरें</div><div id="suggestList"></div></div></div><script>const NEWS=[{"title": "\ud83c\udfcf \u0935\u093f\u0930\u093e\u091f \u0915\u094b\u0939\u0932\u0940 \u0915\u093e \u092c\u0921\u093c\u093e \u0910\u0932\u093e\u0928! 2027 \u0935\u0930\u094d\u0932\u094d\u0921 \u0915\u092a \u0939\u094b\u0917\u093e \u092d\u093e\u0930\u0924 \u0915\u0947 \u0932\u093f\u090f \u0909\u0928\u0915\u093e \u0906\u0916\u093f\u0930\u0940 World Cup", "summary": "Virat Kohli ne 2027 World Cup ko apna aakhiri bataya.\\n\\n[img]https://upload.wikimedia.org/wikipedia/commons/1/15/Virat_Kohli_portrait.jpg[/img]\\n\\nIndian cricket ke star Virat Kohli ne kaha ki 2027 World Cup unke liye last hoga.\\n\\n[img]https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=800[/img]\\n\\n2027 World Cup South Africa, Zimbabwe aur Namibia me hoga.\\n\\nSource: ICC, Reuters", "label": "India", "image": "https://upload.wikimedia.org/wikipedia/commons/1/15/Virat_Kohli_portrait.jpg", "date": "28/9/2026"}, {"title": "\u091c\u092f\u092a\u0941\u0930 \u092e\u0947\u0902 Hawa Mahal \u092a\u0930 \u0928\u092f\u093e \u0932\u093e\u0907\u091f \u0936\u094b \u0936\u0941\u0930\u0942", "summary": "Jaipur Nagar Nigam ne naya light show shuru kiya.\\n\\n[img]https://images.unsplash.com/photo-1599661046289-e31897846e41?w=800[/img]\\n\\nRoz shaam 7 baje se shuru hoga.", "label": "\u0930\u093e\u091c\u0938\u094d\u0925\u093e\u0928", "image": "https://images.unsplash.com/photo-1599661046289-e31897846e41?w=800", "date": "13 May 2026"}];let activeCat="All";function getCategories(){return ["All",...new Set(NEWS.map(n=>n.label))];}function renderCats(){document.getElementById('catBar').innerHTML=getCategories().map(c=>'<div class="cat '+(activeCat===c?'active':'')+'" onclick="setCat(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</div>').join('');}function setCat(c){activeCat=c;renderCats();renderList();}function filtered(){return activeCat==="All"?NEWS:NEWS.filter(n=>n.label===activeCat);}function renderList(){document.getElementById('newsList').innerHTML=filtered().map(n=>{const idx=NEWS.indexOf(n);return '<div class="news-card" onclick="openDetail('+idx+')"><img src="'+n.image+'" onerror="this.src=\'https://via.placeholder.com/90\'"><div style="flex:1"><div class="label">'+n.label+'</div><div class="title">'+n.title+'</div><div class="summary">'+n.summary.replace(/\[img\].*?\[\/img\]/g,'[फोटो]').substring(0,110)+'...</div><div class="read">Read More →</div><div class="date">'+n.date+'</div></div></div>';}).join('');}function formatContent(text){let html=text.replace(/\[img\](.*?)\[\/img\]/g,function(_,url){return '<img class="mid-img" src="'+url.trim()+'" onerror="this.style.display=\'none\'" loading="lazy">';});let parts=html.split('\n');let out='';for(let p of parts){p=p.trim();if(!p) continue;if(p.startsWith('<img')){out+=p;}else{out+='<p>'+p+'</p>';}}return out;}function openDetail(idx){const n=NEWS[idx];document.getElementById('detailLabel').innerText=n.label;document.getElementById('detailTitle').innerText=n.title;document.getElementById('detailImg').src=n.image;document.getElementById('detailFull').innerHTML=formatContent(n.summary);document.getElementById('detailDate').innerText=n.date;document.getElementById('suggestList').innerHTML=NEWS.filter((_,i)=>i!==idx).slice(0,4).map(s=>{const sIdx=NEWS.indexOf(s);return '<div class="news-card" onclick="openDetail('+sIdx+')"><img src="'+s.image+'"><div style="flex:1"><div class="label">'+s.label+'</div><div class="title" style="font-size:13px">'+s.title+'</div><div class="read">Read →</div></div></div>';}).join('');document.getElementById('detail').style.display='block';window.scrollTo(0,0);}function closeDetail(){document.getElementById('detail').style.display='none';}renderCats();renderList();</script></body></html>
